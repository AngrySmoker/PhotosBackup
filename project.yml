name: PhotosBackup

options:
  bundleIdPrefix: dev.gpmc.authprobe
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    # The configured Personal Team signs device builds. Simulator builds use
    # Xcode's local signing identity, which is sufficient for Keychain access.
    DEVELOPMENT_TEAM: QCXRK5J98S
    CODE_SIGN_STYLE: Automatic

targets:
  PhotosBackup:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: GPMC/Core
      - path: App/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: App/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.gpmc.authprobe
        CODE_SIGN_ENTITLEMENTS: App/PhotosBackup.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: NO
    dependencies:
      - target: PhotosBackupExtension
        embed: true

  PhotosBackupExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extension/Sources
      - path: Extension/WebResources
        # Listed as a source dir with the resources build phase so each web
        # extension file (manifest.json, *.js, *.html, icons) is added as a
        # plain file reference and lands at the extension bundle root, which is
        # where Safari looks for manifest.json.
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Extension/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.gpmc.authprobe.Extension
        CODE_SIGN_ENTITLEMENTS: Extension/PhotosBackupExtension.entitlements
        GENERATE_INFOPLIST_FILE: NO

  PhotosBackupTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PhotosBackupTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.gpmc.authprobe.Tests
    dependencies:
      - target: PhotosBackup

schemes:
  PhotosBackup:
    build:
      targets:
        PhotosBackup: all
        PhotosBackupTests: [test]
    test:
      targets:
        - PhotosBackupTests
